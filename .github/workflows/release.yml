name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent build/iConvert.app iConvert.zip
      - run: gh release create "$GITHUB_REF_NAME" iConvert.zip install.sh uninstall.sh --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
